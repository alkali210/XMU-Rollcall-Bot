name: Build binaries with Nuitka

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows, arch: amd64, runner: windows-2025, python-arch: x64 }
          - { platform: windows, arch: arm64, runner: windows-11-arm, python-arch: ARM64 }
          - { platform: linux, arch: amd64, runner: ubuntu-24.04, python-arch: x64 }
          - { platform: linux, arch: arm64, runner: ubuntu-24.04-arm, python-arch: arm64 }
          - { platform: macos, arch: amd64, runner: macos-15-intel, python-arch: x64 }
          - { platform: macos, arch: arm64, runner: macos-15, python-arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: xmu-rollcall-cli
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python-arch }}
          cache: pip
          cache-dependency-path: xmu-rollcall-cli/pyproject.toml
      - name: Install Linux build tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: Install application and packaging tools
        run: python -m pip install . "Nuitka>=2.7,<5" ordered-set zstandard
      - name: Read package version
        id: package-version
        shell: bash
        run: echo "version=$(python -c 'from importlib.metadata import version; print(version("xmu-rollcall-cli"))')" >> "$GITHUB_OUTPUT"
      - name: Build Windows single-file executable
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
          XMU_ROLLCALL_CONFIG_DIR: ${{ runner.temp }}/xmu-rollcall-build-config
          TARGET_ARCH: ${{ matrix.arch }}
        run: >-
          python -m nuitka --mode=onefile --windows-console-mode=force
          --msvc=latest --assume-yes-for-downloads --jobs=4
          --output-filename="xmu-rollcall-$env:PACKAGE_VERSION-windows-$env:TARGET_ARCH.exe" --output-dir=dist
          --include-package=xmulogin --include-package-data=xmulogin
          packaging/entry.py
      - name: Build Unix single-file executable
        if: matrix.platform != 'windows'
        shell: bash
        env:
          XMU_ROLLCALL_CONFIG_DIR: ${{ runner.temp }}/xmu-rollcall-build-config
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: >-
          python -m nuitka --mode=onefile --assume-yes-for-downloads --jobs=4
          --output-filename="xmu-rollcall-${PACKAGE_VERSION}-${TARGET_PLATFORM}-${TARGET_ARCH}" --output-dir=dist
          --include-package=xmulogin --include-package-data=xmulogin
          packaging/entry.py
      - name: Smoke test Windows executable
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: python packaging/smoke_exe.py "dist/xmu-rollcall-$env:PACKAGE_VERSION-windows-$env:TARGET_ARCH.exe"
      - name: Smoke test Unix executable
        if: matrix.platform != 'windows'
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: python packaging/smoke_exe.py "dist/xmu-rollcall-${PACKAGE_VERSION}-${TARGET_PLATFORM}-${TARGET_ARCH}"
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: xmu-rollcall-${{ matrix.platform }}-${{ matrix.arch }}
          path: xmu-rollcall-cli/dist/xmu-rollcall-${{ steps.package-version.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.platform == 'windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 30
