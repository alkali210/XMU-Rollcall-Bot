name: Build Windows EXE

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: xmu-rollcall-cli
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Configure build config directory
        run: |
          "XMU_ROLLCALL_CONFIG_DIR=$env:RUNNER_TEMP/xmu-rollcall-build-config" >> $env:GITHUB_ENV
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
          cache-dependency-path: xmu-rollcall-cli/pyproject.toml
      - name: Install application and packaging tools
        run: python -m pip install . "pyinstaller>=6.16,<7"
      - name: Read package version
        id: package-version
        run: |
          $packageVersion = python -c "from importlib.metadata import version; print(version('xmu-rollcall-cli'))"
          if ($LASTEXITCODE -ne 0) { throw "Failed to read package version" }
          "exe-name=xmu-rollcall-$packageVersion" >> $env:GITHUB_OUTPUT
      - name: Build single-file console executable
        env:
          EXE_NAME: ${{ steps.package-version.outputs.exe-name }}
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --console
          --name "$env:EXE_NAME" --collect-all xmulogin
          --distpath dist --workpath build --specpath build
          packaging/windows_entry.py
      - name: Upload Windows x64 executable
        uses: actions/upload-artifact@v4
        with:
          name: xmu-rollcall-windows-x64
          path: xmu-rollcall-cli/dist/${{ steps.package-version.outputs.exe-name }}.exe
          if-no-files-found: error
          retention-days: 30
