name: Build Windows EXE

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, alpha]
    paths:
      - "xmu-rollcall-cli/**"
      - ".github/workflows/windows-exe.yml"
  pull_request:
    paths:
      - "xmu-rollcall-cli/**"
      - ".github/workflows/windows-exe.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: xmu-rollcall-cli
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Configure build config directory
        run: |
          "XMU_ROLLCALL_CONFIG_DIR=$env:RUNNER_TEMP/xmu-rollcall-build-config" >> $env:GITHUB_ENV
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
          cache-dependency-path: xmu-rollcall-cli/pyproject.toml
      - name: Install application and packaging tools
        run: python -m pip install . "pyinstaller>=6.16,<7"
      - name: Build single-file console executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --console
          --name xmurollcall-cli --collect-all xmulogin
          --distpath dist --workpath build --specpath build
          packaging/windows_entry.py
      - name: Upload Windows x64 executable
        uses: actions/upload-artifact@v4
        with:
          name: xmurollcall-cli-windows-x64
          path: xmu-rollcall-cli/dist/xmurollcall-cli.exe
          if-no-files-found: error
          retention-days: 30
